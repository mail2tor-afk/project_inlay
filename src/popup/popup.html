<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact-Check Overlay Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .settings-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #e2e8f0;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-size: 13px;
      color: #cbd5e1;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: #3b82f6;
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active .toggle-knob {
      transform: translateX(20px);
    }

    .status-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 12px;
    }

    .status-label {
      color: #94a3b8;
    }

    .status-value {
      color: #f1f5f9;
      font-weight: 600;
    }

    .status-value.active {
      color: #22c55e;
    }

  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔍</div>
    <h1>Fact-Check Overlay</h1>
    <p class="subtitle">Real-time video verification</p>
  </div>

  <!-- Settings Section -->
  <div class="settings-section">
    <div class="section-title">⚙️ Settings</div>
    
    <div class="setting-item">
      <span class="setting-label">Show Overlay</span>
      <div class="toggle active" id="overlayToggle">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <!-- Status Section -->
  <div class="status-section">
    <div class="section-title">📊 Status</div>
    
    <div class="status-item">
      <span class="status-label">Extension Version</span>
      <span class="status-value">0.1.0</span>
    </div>

    <div class="status-item">
      <span class="status-label">Backend Status</span>
      <span class="status-value" id="backendStatus">Disconnected</span>
    </div>

    <div class="status-item">
      <span class="status-label">Last Sync</span>
      <span class="status-value" id="lastSync">Never</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
